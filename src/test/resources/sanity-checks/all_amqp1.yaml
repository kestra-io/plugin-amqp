id: all_amqp1
namespace: sanitychecks.plugin-amqp

variables:
  host: localhost
  username: artemis
  password: artemis
  address: amqp1.sanity.{{ execution.id }}

tasks:
  - id: init
    type: io.kestra.plugin.core.output.OutputValues
    values:
      port: "{{ randomPort() }}"

  - id: docker_start
    type: io.kestra.plugin.docker.Run
    containerImage: apache/activemq-artemis:2.44.0-alpine
    # the image creates the broker instance in its working directory, which the task otherwise overrides
    entryPoint:
      - /bin/sh
      - -c
    commands:
      - cd /var/lib/artemis-instance && exec /docker-run.sh run
    portBindings:
      - "{{ outputs.init.values.port }}:5672"
    env:
      ARTEMIS_USER: "{{ vars.username }}"
      ARTEMIS_PASSWORD: "{{ vars.password }}"
      EXTRA_ARGS: "--java-options -Dbrokerconfig.addressSettings.#.defaultAddressRoutingType=ANYCAST"
    wait: false

  - id: wait_artemis
    type: io.kestra.plugin.core.flow.Sleep
    duration: PT15S

  - id: publish
    type: io.kestra.plugin.amqp.Amqp1Publish
    host: "{{ vars.host }}"
    port: "{{ outputs.init.values.port }}"
    username: "{{ vars.username }}"
    password: "{{ vars.password }}"
    address: "{{ vars.address }}"
    serdeType: JSON
    from:
      - data:
          value: sanity-value-1
        applicationProperties:
          source: sanity-check
      - data:
          value: sanity-value-2
        durable: true

  - id: consume
    type: io.kestra.plugin.amqp.Amqp1Consume
    host: "{{ vars.host }}"
    port: "{{ outputs.init.values.port }}"
    username: "{{ vars.username }}"
    password: "{{ vars.password }}"
    address: "{{ vars.address }}"
    serdeType: JSON
    maxRecords: 2
    maxDuration: PT10S

  - id: assert
    type: io.kestra.plugin.core.execution.Assert
    conditions:
      - "{{ outputs.publish.messagesCount == 2 }}"
      - "{{ outputs.consume.count == 2 }}"
      - "{{ fromIon(read(outputs.consume.uri), allRows=true) | length == 2 }}"

finally:
  - id: purge
    type: io.kestra.plugin.core.storage.PurgeCurrentExecutionFiles

  - id: docker_stop
    type: io.kestra.plugin.docker.Stop
    containerId: "{{ outputs.docker_start.taskRunner.containerId }}"
    kill: true
